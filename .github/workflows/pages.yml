name: Verify and publish SaySo website

on:
  pull_request:
    paths: ["sayso-website/**", "mcp/**", "plugins/**", "scripts/**", "*.md", "SOURCE_MANIFEST.json", ".github/workflows/pages.yml"]
  push:
    paths: ["sayso-website/**", "mcp/**", "plugins/**", "scripts/**", "*.md", "SOURCE_MANIFEST.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified integrated website to GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sayso-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            sayso-website/package-lock.json
            sayso-website/sayso-install/package-lock.json
      - name: Verify the pinned source inventory
        run: node scripts/verify-source.mjs
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm run install:ci
      - name: Verify MCP source
        working-directory: mcp
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Install website dependencies
        working-directory: sayso-website
        run: npm ci
      - name: Install independent installer dependencies
        working-directory: sayso-website/sayso-install
        run: npm ci
      - name: Verify both applications and assemble one production artifact
        working-directory: sayso-website
        run: npm run build:integrated
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: sayso-website/dist/pages
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
